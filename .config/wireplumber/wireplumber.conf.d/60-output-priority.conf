# Prefer PC headphones, then the Jieli USB speaker, then built-in speakers.
wireplumber.settings = {
  node.restore-default-targets = false
  linking.follow-default-target = true
}
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.*" } ]
    actions = { update-props = { priority.session = 500 } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Headphones__sink" } ]
    actions = { update-props = { priority.session = 1400 } }
  }
  {
    matches = [ { node.name = "alsa_output.usb-Jieli_Technology_USB_Composite_Device_4250315A35353802-01.analog-stereo" } ]
    actions = { update-props = { priority.session = 1300 } }
  }
  {
    matches = [ { node.name = "alsa_output.pci-0000_00_1f.3-platform-skl_hda_dsp_generic.HiFi__Speaker__sink" } ]
    actions = { update-props = { priority.session = 1200 } }
  }
]
